name: CI

on:
  push:
    branches: [main, "feat/**", "feature/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: hassfest and HACS rules evolve even when the code does not
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  validate:
    name: Validate (hassfest + HACS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # No brand icon and no repository topics yet
          ignore: brands topics

  package:
    name: Build release package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Build claude_usage.zip
        run: |
          cd custom_components
          zip -r ../claude_usage.zip claude_usage/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: claude_usage
          path: claude_usage.zip
          retention-days: 30
